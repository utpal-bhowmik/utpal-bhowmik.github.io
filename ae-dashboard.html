                return date.getFullYear() + 59;

            const deleteEngineer = (erpId, name) => {

                    setEngineers(prev => prev.filter(item => item.erpId !== erpId));
                    triggerToast(`Removed record of ${name}`, "warning");

            };

            // Batch import tool processing
            const handleBatchImport = () => {
                if (!importText.trim()) {
                    triggerToast("Please enter data to import", "error");
                    return;
                }

                try {
                    let parsedData = [];
                    if (importFormat === "json") {
                        parsedData = JSON.parse(importText);
                        if (!Array.isArray(parsedData)) throw new Error("JSON data must be an array of objects");
                    } else {
                        // Handle CSV / TSV split parsing
                        const delimiter = importFormat === "tsv" ? "\t" : ",";
                        const lines = importText.split("\n").filter(line => line.trim());
                        
                        // Expect headers: serial, name, district, dob, erpId, discipline, idNo, joinDate, posting
                        const headers = lines[0].split(delimiter).map(h => h.trim().replace(/^["']|["']$/g, ''));
                        
                        parsedData = lines.slice(1).map((line, idx) => {
                            const values = line.split(delimiter).map(v => v.trim().replace(/^["']|["']$/g, ''));
                            const entry = {};
                            headers.forEach((header, index) => {
                                entry[header] = values[index] || "";
                            });
                            
                            // Essential Fallback standardizations
                            entry.serial = Number(entry.serial) || (idx + 1);
                            if (!entry.discipline) entry.discipline = "Electrical";
                            return entry;
                        });
                    }

                    // Remove duplicates by ERP ID, merging into the database state
                    const existingMap = new Map(engineers.map(e => [e.erpId, e]));
                    parsedData.forEach(item => {
                        if (item.erpId) {
                            existingMap.set(item.erpId, item);
                        }
                    });

                    setEngineers(Array.from(existingMap.values()));
                    triggerToast(`Successfully imported & synchronized ${parsedData.length} records!`, "success");
                    setIsImportModalOpen(false);
                    setImportText("");
                } catch (error) {
                    console.error(error);
                    triggerToast("Import failed. Verify the format rules and retry.", "error");
                }
            };

                const headers = ["serial", "name", "district", "dob", "erpId", "discipline", "idNo", "joinDate", "posting"];
                const csvRows = [headers.join(",")];
                
                engineers.forEach(eng => {
                    const values = headers.map(header => {
                        const val = eng[header] || "";
                        return `"${val.toString().replace(/"/g, '""')}"`;
                    });
                    csvRows.push(values.join(","));
                });

                const csvContent = "data:text/csv;charset=utf-8," + csvRows.join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);

                                                            {eng.posting || "N/A"}
                                                        </td>
                                                        <td className="py-4 px-6 text-center">
                                                            <div className="flex items-center justify-center gap-2">
                                                                <button 
                                                                    onClick={() => openModal(eng)}
                                                                    title="Edit Officer Record"
                                                                    className="p-2 bg-slate-800 hover:bg-slate-700 hover:text-blue-400 rounded-lg text-slate-400 transition-colors border border-slate-700/50"
                                                                >
                                                                    <i className="fa-solid fa-user-pen"></i>
                                                                </button>
                                                                <button 
                                                                    onClick={() => deleteEngineer(eng.erpId, eng.name)}
                                                                    title="Delete Officer Record"
                                                                    className="p-2 bg-slate-800 hover:bg-slate-700 hover:text-red-400 rounded-lg text-slate-400 transition-colors border border-slate-700/50"
                                                                >
                                                                    <i className="fa-solid fa-trash-can"></i>
                                                                </button>
                                                            </div>
                                                        </td>
                                                    </tr>
                                                );
                                            })
                                        ) : (
                                            <tr>
                                                <td colSpan="7" className="py-12 text-center text-slate-500 font-medium">
                                                    <div className="flex flex-col items-center justify-center gap-3">
                                                        <i className="fa-solid fa-user-slash text-3xl text-slate-700"></i>
                                                        <span>No engineers matching the query filters. Try adjusting search criteria or importing the full 564 list.</span>
                                                    </div>
                                                </td>
                                            </tr>
                                        )}
                                    </tbody>
                                </table>
                            </div>
                        </section>
                    </main>

                    {/* Batch Import Tool Modal */}
                    {isImportModalOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-3xl shadow-2xl relative overflow-hidden flex flex-col my-8">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-teal-500 to-emerald-500"></div>
                                
                                <div className="p-6 border-b border-slate-800/80 flex items-center justify-between">
                                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-file-import text-teal-400"></i>
                                        <span>Batch Import Seniority List</span>
                                    </h3>
                                    <button 
                                        onClick={() => setIsImportModalOpen(false)}
                                        className="text-slate-400 hover:text-white transition-colors"
                                    >
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <div className="p-6 space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-400 mb-2">Import Format</label>
                                        <div className="flex gap-4">
                                            {["csv", "tsv", "json"].map(format => (
                                                <label key={format} className="flex items-center gap-2 cursor-pointer text-xs">
                                                    <input 
                                                        type="radio" 
                                                        name="import_fmt" 
                                                        value={format}
                                                        checked={importFormat === format}
                                                        onChange={(e) => setImportFormat(e.target.value)}
                                                        className="accent-teal-500"
                                                    />
                                                    <span className="uppercase font-semibold text-slate-300">{format}</span>
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    <div>
                                        <div className="flex justify-between mb-1.5">
                                            <label className="block text-xs font-semibold text-slate-400">Raw Data Input</label>
                                            <span className="text-[10px] text-slate-500 font-mono">
                                                Headers: serial, name, district, dob, erpId, discipline, idNo, joinDate, posting
                                            </span>
                                        </div>
                                        <textarea 
                                            rows="10"
                                            value={importText}
                                            onChange={(e) => setImportText(e.target.value)}
                                            placeholder={
                                                importFormat === "csv" ? "serial,name,district,dob,erpId,discipline,idNo,joinDate,posting\n1,জনাব মোহাম্মদ আলী বাবলু,জামালপুর,1989-11-10,140038536,Mechanical,১-০২১৬৯,2015-07-13,জৈন্তাপুর বিদ্যুৎ সরবরাহ" :
                                                importFormat === "tsv" ? "serial\tname\tdistrict\tdob\terpId\tdiscipline\tidNo\tjoinDate\tposting\n1\tজনাব মোহাম্মদ আলী বাবলু\tজামালপুর\t1989-11-10\t140038536\tMechanical\t১-০২১৬৯\t2015-07-13\tজৈন্তাপুর" :
                                                "[\n  {\n    \"serial\": 1,\n    \"name\": \"জনাব মোহাম্মদ আলী বাবলু\",\n    \"district\": \"জামালপুর\",\n    \"dob\": \"1989-11-10\",\n    \"erpId\": \"140038536\",\n    \"discipline\": \"Mechanical\",\n    \"idNo\": \"১-০২১৬৯\",\n    \"joinDate\": \"2015-07-13\",\n    \"posting\": \"জৈন্তাপুর\"\n  }\n]"
                                            }
                                            className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3.5 text-slate-200 text-xs font-mono focus:outline-none focus:border-teal-500 leading-relaxed"
                                        ></textarea>
                                    </div>

                                    <div className="p-4 bg-slate-950/50 rounded-xl border border-slate-850 space-y-2 text-[11px] text-slate-400">
                                        <p className="font-semibold text-slate-300">How to load your complete list of 564 records:</p>
                                        <ul className="list-disc pl-5 space-y-1">
                                            <li>Extract the text or tables from your "Seniority List of AE .pdf" using an online PDF-to-Excel tool or Python script.</li>
                                            <li>Align the columns in Excel to match: <strong>serial, name, district, dob, erpId, discipline, idNo, joinDate, posting</strong></li>
                                            <li>Save as <strong>CSV</strong> or simply copy the rows from Excel, select the <strong>TSV</strong> tab above, and paste directly!</li>
                                        </ul>
                                    </div>

                                    <div className="pt-4 border-t border-slate-800/80 flex items-center justify-end gap-3">
                                        <button 
                                            type="button"
                                            onClick={() => setIsImportModalOpen(false)}
                                            className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold transition-all"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="button"
                                            onClick={handleBatchImport}
                                            className="px-5 py-2 bg-gradient-to-r from-teal-600 to-emerald-600 hover:from-teal-500 hover:to-emerald-500 text-white rounded-xl text-xs font-semibold transition-all shadow-md"
                                        >
                                            Import & Parse Data
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CRUD Modal dialog */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-2xl shadow-2xl relative overflow-hidden flex flex-col my-8">
                                <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-blue-500 to-indigo-500"></div>
                                
                                <div className="p-6 border-b border-slate-800/80 flex items-center justify-between">
                                    <h3 className="text-base font-bold text-white flex items-center gap-2">
                                        <i className="fa-solid fa-user-gear text-blue-400"></i>
                                        <span>{currentEngineer ? "Update Officer Parameters" : "Register New BPDB Officer"}</span>
                                    </h3>
                                    <button 
                                        onClick={() => setIsModalOpen(false)}
                                        className="text-slate-400 hover:text-white transition-colors"
                                    >
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>
                                </div>

                                <form onSubmit={saveEngineer} className="p-6 space-y-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 mb-2">Seniority Serial Number *</label>
                                            <input 
                                                type="number"
                                                required
                                                value={formData.serial}
                                                onChange={(e) => setFormData({...formData, serial: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3.5 text-slate-200 text-xs focus:outline-none focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 mb-2">Discipline / Branch *</label>
                                            <select 
                                                value={formData.discipline}
                                                onChange={(e) => setFormData({...formData, discipline: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3 text-slate-200 text-xs focus:outline-none focus:border-blue-500"
                                            >
                                                <option value="Electrical">Electrical</option>
                                                <option value="Mechanical">Mechanical</option>
                                                <option value="Civil">Civil</option>
                                                <option value="Computer">Computer</option>
                                                <option value="Chemical">Chemical</option>
                                                <option value="Power">Power</option>
                                                <option value="Metallurgical">Metallurgical</option>
                                            </select>
                                        </div>

                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-semibold text-slate-400 mb-2">Officer Full Name (Bengali) *</label>
                                            <input 
                                                type="text"
                                                required
                                                value={formData.name}
                                                onChange={(e) => setFormData({...formData, name: e.target.value})}
                                                placeholder="উদাঃ জনাব মোঃ আসিফুজ্জামান"
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2.5 px-3.5 text-slate-200 text-xs focus:outline-none focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 mb-2">ERP ID Code *</label>
                                            <input 
                                                type="text"
                                                required
                                                value={formData.erpId}
                                                onChange={(e) => setFormData({...formData, erpId: e.target.value})}
                                                placeholder="e.g., 140038764"
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3.5 text-slate-200 text-xs focus:outline-none focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 mb-2">Identity Number (পরিচয়জ্ঞাপক) *</label>
                                            <input 
                                                type="text"
                                                required
                                                value={formData.idNo}
                                                onChange={(e) => setFormData({...formData, idNo: e.target.value})}
                                                placeholder="e.g., ১-০২৩৯৩"
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3.5 text-slate-200 text-xs focus:outline-none focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 mb-2">Home District *</label>
                                            <input 
                                                type="text"
                                                required
                                                value={formData.district}
                                                onChange={(e) => setFormData({...formData, district: e.target.value})}
                                                placeholder="e.g., নড়াইল"
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3.5 text-slate-200 text-xs focus:outline-none focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 mb-2">Date of Birth (DOB) *</label>
                                            <input 
                                                type="date"
                                                required
                                                value={formData.dob}
                                                onChange={(e) => setFormData({...formData, dob: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3.5 text-slate-200 text-xs focus:outline-none focus:border-blue-500"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-400 mb-2">Initial Joining Date *</label>
                                            <input 
                                                type="date"
                                                required
                                                value={formData.joinDate}
                                                onChange={(e) => setFormData({...formData, joinDate: e.target.value})}
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3.5 text-slate-200 text-xs focus:outline-none focus:border-blue-500"
                                            />
                                        </div>

                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-semibold text-slate-400 mb-2">Current Active Posting Station (Bengali)</label>
                                            <textarea 
                                                rows="2"
                                                value={formData.posting}
                                                onChange={(e) => setFormData({...formData, posting: e.target.value})}
                                                placeholder="ঘোড়াশাল বিদ্যুৎ কেন্দ্র, বিউবো, পলাশ, নরসিংদী"
                                                className="w-full bg-slate-950 border border-slate-800 rounded-xl py-2 px-3.5 text-slate-200 text-xs focus:outline-none focus:border-blue-500"
                                            ></textarea>
                                        </div>
                                    </div>

                                    <div className="pt-4 border-t border-slate-800/80 flex items-center justify-end gap-3">
                                        <button 
                                            type="button"
                                            onClick={() => setIsModalOpen(false)}
                                            className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-semibold transition-all"
                                        >
                                            Cancel
                                        </button>
                                        <button 
                                            type="submit"
                                            className="px-5 py-2 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-xl text-xs font-semibold transition-all shadow-md shadow-blue-500/15"
                                        >
                                            Save Officer Record
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Dynamic Toast Feedback alerts */}
                    {toast && (
                        <div className="fixed bottom-6 right-6 z-50">
                            <div className={`flex items-center gap-3 px-4 py-3 bg-slate-900 rounded-xl shadow-2xl border ${
                                toast.type === "success" ? "border-emerald-500/30 text-emerald-400" :
                                toast.type === "warning" ? "border-amber-500/30 text-amber-400" :
                                toast.type === "error" ? "border-red-500/30 text-red-400" :
                                "border-blue-500/30 text-blue-400"
                            }`}>
                                <span className="text-sm">
                                    {toast.type === "success" && <i className="fa-solid fa-circle-check"></i>}
                                    {toast.type === "warning" && <i className="fa-solid fa-triangle-exclamation"></i>}
                                    {toast.type === "error" && <i className="fa-solid fa-circle-xmark"></i>}
                                    {toast.type === "info" && <i className="fa-solid fa-circle-info"></i>}
                                </span>
                                <span className="text-xs font-medium">{toast.message}</span>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
